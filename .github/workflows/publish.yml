name: Publish public client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Pin the reviewed npm major; npm@latest can introduce incompatible pack JSON.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
      - run: npm run secret-scan && npm run package:audit
      - name: Refuse an existing package version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Version already exists: $package_name@$package_version"
            exit 1
          fi
      - run: npm publish --access public --provenance
